name: Native iOS verification
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # BF_CLIENT_AUDIT_v110 - lint (rules of hooks) gates native builds too.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm --prefix client-app run test:ci
      - name: Source-grep test budget
        run: node scripts/check-source-grep-tests.mjs
      - run: npm run build
      - name: Verify Capacitor web artifact
        run: test -f client-app/dist/index.html
      - run: npx cap sync ios
        working-directory: client-app
      - name: Verify post-sync iOS release guardrails
        run: python3 scripts/verify-ios-release.py
      - name: Resolve CapApp-SPM package
        run: swift package resolve --package-path client-app/ios/App/CapApp-SPM
      - name: Resolve Swift package dependencies
        run: >-
          xcodebuild
          -resolvePackageDependencies
          -project client-app/ios/App/App.xcodeproj
          -scheme App
      # BF_CLIENT_BUILD_NUMBER_v8 - CFBundleVersion is $(CURRENT_PROJECT_VERSION);
      # the project default stays 1 for local builds, CI uses the run number.
      - name: Build unsigned iOS Simulator app
        run: >-
          xcodebuild
          -project client-app/ios/App/App.xcodeproj
          -scheme App
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CURRENT_PROJECT_VERSION=${{ github.run_number }}
          clean build

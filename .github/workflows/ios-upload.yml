# BF_CLIENT_v813_IOS_UPLOAD - builds the iPhone/iPad app in the cloud and uploads it to App Store Connect, so no
# Mac or Xcode is needed. Run it by hand: GitHub > Actions > "Upload iOS build" > Run workflow. It never runs on
# its own. Signing uses the company Apple account (team 76VAY7UJKJ) through an App Store Connect API key kept in
# the repo secrets ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 (the full text of the .p8 file). Each run gets a new
# build number (1000 + run number), so Apple never refuses a repeat. The build then appears in App Store Connect
# (TestFlight and the version page) after Apple finishes processing it, usually 10-30 minutes.
name: Upload iOS build
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What changed (shown in the run summary only)"
        required: false
        default: ""
concurrency:
  group: ios-upload
  cancel-in-progress: false
jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Check the App Store Connect key is set up
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi
      - name: Pick the build number (1000 + run number)
        run: echo "BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - name: Use the newest released Xcode (App Store Connect refuses beta builds)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: xcodebuild -version
      - run: npm ci
      - run: npm run build
      - name: Verify Capacitor web artifact
        run: test -f client-app/dist/index.html
      - run: npx cap sync ios
        working-directory: client-app
      - name: Verify post-sync iOS release guardrails
        run: python3 scripts/verify-ios-release.py
      - name: Install the App Store Connect key
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
      # BOREAL_v833_CERT_CLEANUP - each cloud run makes Xcode create an "Apple Development" certificate ("Created via
      # API") and Apple allows only a few, so archiving started failing. This deletes the leftover API-made development
      # certificates from earlier runs (older than 75 minutes, in any of the three apps) and nothing else: the
      # Distribution Managed certificate, Andrew Polturak's development certificate and the VoIP certificates are kept.
      # It never fails the run.
      - name: Delete leftover cloud development certificates
        continue-on-error: true
        run: node scripts/asc-cleanup-dev-certs.mjs
      - name: Archive (signed with the company team)
        run: >-
          xcodebuild archive
          -project client-app/ios/App/App.xcodeproj
          -scheme App
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/App.xcarchive"
          -allowProvisioningUpdates
          -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          -authenticationKeyID "$ASC_KEY_ID"
          -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          DEVELOPMENT_TEAM=76VAY7UJKJ
          CODE_SIGN_STYLE=Automatic
          CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
      - name: Upload to App Store Connect
        run: >-
          xcodebuild -exportArchive
          -archivePath "$RUNNER_TEMP/App.xcarchive"
          -exportOptionsPlist client-app/ios/App/ci/ExportOptions.plist
          -exportPath "$RUNNER_TEMP/export"
          -allowProvisioningUpdates
          -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          -authenticationKeyID "$ASC_KEY_ID"
          -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Summary
        if: success()
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          {
            echo "### Uploaded to App Store Connect"
            echo "- App: com.borealfinancial.client"
            echo "- Build number: $BUILD_NUMBER"
            echo "- Notes: ${NOTES:-none}"
            echo "Apple processes the build for 10-30 minutes, then it can be picked on the App Store version page."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"

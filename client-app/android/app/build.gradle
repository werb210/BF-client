apply plugin: 'com.android.application'
// BF_CLIENT_ANDROID_FCM_v1
// @capacitor/push-notifications resolves to FCM on Android and needs the
// google-services plugin to read google-services.json. Without it the plugin
// registers no token and PushNotifications.register() silently never fires
// its registration listener.
apply plugin: 'com.google.gms.google-services'

android {
    namespace = "com.boreal.client"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.boreal.client"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // BF_CLIENT_BUILD_NUMBER_v8 - CI sets GITHUB_RUN_NUMBER so every build
        // uploads with a higher versionCode; local builds stay at 1.
        // BF_CLIENT_ANDROID_UPLOAD_v1 - ANDROID_VERSION_CODE (set by the upload workflow) wins, so a Play upload
        // is always numbered above the version already in the store.
        versionCode((System.getenv("ANDROID_VERSION_CODE") ?: System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger())
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // BF_CLIENT_ANDROID_UPLOAD_v1 - release signing: the upload workflow writes the upload key from secrets and
    // passes its location in the environment. Without it the release build is unsigned (the pull-request check),
    // never signed with a made-up key.
    signingConfigs {
        upload {
            def ks = System.getenv("ANDROID_KEYSTORE_FILE")
            if (ks && file(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            def uploadKey = System.getenv("ANDROID_KEYSTORE_FILE")
            if (uploadKey && file(uploadKey).exists()) signingConfig signingConfigs.upload
            // BF_CLIENT_ANDROID_R8_v119 - shrink/obfuscate release builds; keep rules
            // for Capacitor and every installed plugin live in proguard-rules.pro.
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // BF_CLIENT_ANDROID_PUSH_ACTIONS_FIX_v162
    // BorealMessagingService extends FirebaseMessagingService, which this
    // module could not see: @capacitor/push-notifications declares
    // firebase-messaging as `implementation`, so it is not exposed to
    // consumers. Without it the base class is unresolved, and every use of
    // `this` as a Context fails too - one missing dependency, ten errors.
    // The BOM keeps the version in step with whatever the plugin resolves.
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
    // BF_CLIENT_BACKGROUND_UPLOAD_v307 - uploads that finish after the app is closed.
    implementation 'androidx.work:work-runtime:2.9.1'
    // BF_CLIENT_v823_SMS_CODE - SMS User Consent API: one tap fills in the sign-in code, no SMS permission.
    implementation 'com.google.android.gms:play-services-auth-api-phone:18.1.0'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

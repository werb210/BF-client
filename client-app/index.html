<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- BF_CLIENT_NOINDEX_v1 - the wizard is an app, not content. Google
         was indexing it as a duplicate of boreal.financial. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- BF_CLIENT_v789_ANALYTICS_GATES - Consent Mode, Google Tag Manager and the
         Google Ads tag are injected by src/lib/thirdPartyTags.ts, on the web only
         (never in the native apps), so the Content-Security-Policy needs no inline
         script. -->
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Boreal Financial</title>
    <!-- BF_CLIENT_BRAND_v167 - same faces as BF-Website, loaded non-blocking so
         the apply step still paints immediately. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- display=swap keeps text visible while the faces load; the old
         media="print" onload trick needed an inline handler the CSP forbids. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Public+Sans:wght@400;500;600;700&display=swap"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- BF_CLIENT_NOINDEX_v1
         Every route here is behind OTP, so there is nothing for Google to index, and
         the landing page duplicated boreal.financial closely enough that Search Console
         flagged it "Duplicate without user-selected canonical" and dropped it. noindex
         rather than robots.txt Disallow: the crawler must still be able to read the page
         for Google Ads landing-page quality, and a blocked crawl can never see a noindex. -->
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://client.boreal.financial/" />
    <meta name="theme-color" content="#020C1C" />
    <meta property="og:image" content="/og.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="icon" href="/favicon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Boreal" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

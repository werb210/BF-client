<!DOCTYPE html>

  <head>
    <!-- Consent Mode v2 — implied consent (CA); banner Decline revokes everything -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        /* BF_CLIENT_ADS_CONSENT_v1: the ad keys used to default to 'denied'
           while analytics_storage defaulted to 'granted' on the same implied-
           consent basis - an inconsistency, not a decision. The Apply
           conversion fires on wizard submit, before most applicants touch the
           banner, so it landed in a denied state and Google recorded it as
           modelled instead of attributed: 52 applications, 2 recorded
           conversions. Declining in the banner still revokes all of these
           (see ConsentBanner.tsx), and Quebec - where Law 25 applies - is
           excluded from the Canada campaign. */
        ad_storage: 'granted',
        analytics_storage: 'granted',
        ad_user_data: 'granted',
        ad_personalization: 'denied', /* personalised remarketing stays off */
        functionality_storage: 'granted',
        security_storage: 'granted',
        wait_for_update: 500
      });
    </script>
    <!-- Google Tag Manager (GA4 G-D1Y4105RXP now configured inside the container) -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);})(window,document,'script','dataLayer','GTM-W2WF8X9P');</script>
    <!-- End Google Tag Manager -->

    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18248196538"></script>

      gtag('js', new Date());
      gtag('config', 'AW-18248196538');
    </script>
